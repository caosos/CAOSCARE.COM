; CAOSCare Pilot 1 - PJSIP (Asterisk 18). Endpoints for room handsets, the
; front desk phone, the SIP trunk and OpenAI Realtime SIP. Passwords, the
; trunk account and per-room DIDs live in pjsip_local.conf (not committed).

[global]
type=global
user_agent=CAOSCare-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; local_net / external_media_address / external_signaling_address: pjsip_local.conf

[transport-tls]
; Outbound TLS to OpenAI (sip.api.openai.com:5061). Certificates: pjsip_local.conf.
type=transport
protocol=tls
bind=0.0.0.0:5061
method=tlsv1_2

; ---------- templates ----------
[phone-endpoint](!)
type=endpoint
disallow=all
allow=ulaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[room-handset](!phone-endpoint)
context=from-room

[front-desk-phone](!phone-endpoint)
context=from-frontdesk

[phone-auth](!)
type=auth
auth_type=userpass

[phone-aor](!)
type=aor
max_contacts=1
qualify_frequency=30

; ---------- OpenAI Realtime SIP ----------
; Aria's extension (700) dials sip:<project>@sip.api.openai.com over TLS with
; SRTP. When Aria transfers, OpenAI sends a REFER; TRANSFER_CONTEXT makes the
; resident's leg continue in [caos-transfer] (extensions.conf).
[openai]
type=endpoint
transport=transport-tls
context=from-openai
disallow=all
allow=ulaw,alaw
media_encryption=sdes
direct_media=no
rtp_symmetric=yes
allow_transfer=yes
set_var=TRANSFER_CONTEXT=caos-transfer
aors=openai

[openai]
type=aor
contact=sip:sip.api.openai.com:5061;transport=tls

#include pjsip_local.conf
