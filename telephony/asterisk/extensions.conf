; CAOSCare Pilot 1 dialplan (Asterisk 18).
;
; Invariants (docs/PILOT1_COMMUNICATIONS.md):
;  - 911 bypasses Aria and CAOSCare entirely. Nothing that can fail or wait
;    sits before the emergency Dial; a failed trunk falls back to a person.
;  - Dial 0 is pure dialplan: it works when CAOSCare or the internet is down.
;  - CAOSCare records calls from ARI events keyed by CAOS_CALL_ID; call
;    state never comes from Aria.
;  - The ATA "warm line" auto-dials 700 (Aria) only after a pause, so 0 and
;    911 can always be dialed from the handset.

[globals]
#include extensions_local.conf

; ---------------- room handsets ----------------
[from-room]
exten => 911,1,NoOp(EMERGENCY from ${CALLERID(num)} room ${ROOM})
 same => n,Set(__CAOS_CALL_ID=emg-${UNIQUEID})
 same => n,ExecIf($["${ROOM_DID}" != ""]?Set(CALLERID(num)=${ROOM_DID}))
 same => n,System(/etc/asterisk/caos-911-alert.sh "${ROOM}" "${FRONT_DESK_EXT}" &)
 same => n,Dial(PJSIP/911@trunk)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Dial(PJSIP/${FRONT_DESK_EXT})
 same => n(done),Hangup()
; Hotel habit: 9 + 911 must also work (Kari's Law: no prefix required, but
; a prefix must not break it).
exten => 9911,1,Goto(911,1)
; Provider E911 address test number (confirm the provider supports 933).
exten => 933,1,ExecIf($["${ROOM_DID}" != ""]?Set(CALLERID(num)=${ROOM_DID}))
 same => n,Dial(PJSIP/933@trunk)
 same => n,Hangup()

exten => 0,1,Set(__CAOS_CALL_ID=fd0-${UNIQUEID})
 same => n,Dial(PJSIP/${FRONT_DESK_EXT},${FRONT_DESK_RING_SECONDS})
 same => n,Hangup()

exten => 700,1,Set(__CAOS_CALL_ID=aria-${UNIQUEID})
 same => n,Set(__CAOS_FROM_EXT=${CALLERID(num)})
 same => n,Dial(PJSIP/openai/sip:${OPENAI_PROJECT_ID}@sip.api.openai.com\;transport=tls,20,b(caos-aria-headers^s^1))
 ; Aria unreachable (internet, OpenAI or CAOSCare down): reach a person.
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Set(__CAOS_CALL_ID=fd0-${UNIQUEID})
 same => n,Dial(PJSIP/${FRONT_DESK_EXT},${FRONT_DESK_RING_SECONDS})
 same => n(done),Hangup()

exten => _X.,1,Playback(ss-noservice)
 same => n,Hangup()

; Pre-dial handler on the OpenAI leg: headers CAOSCare's webhook reads.
[caos-aria-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-CAOS-Call-Id)=${CAOS_CALL_ID})
 same => n,Set(PJSIP_HEADER(add,X-CAOS-Extension)=${CAOS_FROM_EXT})
 same => n,Return()

; ---------------- Aria transfers (REFER from OpenAI) ----------------
; Refer-To user part = 77 + one-time token. CAOSCare resolves it to
; "<call_id>|<dial string>" (front desk extension, or an approved family
; number on the trunk). An unknown/expired token reaches the front desk.
[caos-transfer]
exten => _77XXXXXXXX,1,Set(CURLOPT(httpheader)=X-CAOS-Telephony-Token: ${CAOS_TELEPHONY_TOKEN})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(TARGET=${CURL(${CAOS_API}/telephony/local/dial-target/${EXTEN:2})})
 same => n,GotoIf($["${TARGET}" = ""]?fallback)
 same => n,Set(__CAOS_CALL_ID=${CUT(TARGET,|,1)})
 same => n,ExecIf($["${ROOM_DID}" != ""]?Set(CALLERID(num)=${ROOM_DID}))
 same => n,Dial(${CUT(TARGET,|,2)},45)
 same => n,Hangup()
 same => n(fallback),Set(__CAOS_CALL_ID=fd0-${UNIQUEID})
 same => n,Dial(PJSIP/${FRONT_DESK_EXT},${FRONT_DESK_RING_SECONDS})
 same => n,Hangup()

; ---------------- front desk phone ----------------
[from-frontdesk]
exten => 911,1,Set(__CAOS_CALL_ID=emg-${UNIQUEID})
 same => n,Dial(PJSIP/911@trunk)
 same => n,Hangup()
exten => 9911,1,Goto(911,1)
; Rooms by extension (front desk calls a resident's handset)
exten => _2XX,1,Dial(PJSIP/${EXTEN},45)
 same => n,Hangup()

; ---------------- 911 alert to the front desk (Kari's Law notification) ----------------
; Originated by caos-911-alert.sh through a call file, so it never delays
; the emergency call itself.
[caos-911-alert]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,SayDigits(911)
 same => n,Wait(1)
 same => n,SayDigits(${ALERT_ROOM})
 same => n,Wait(1)
 same => n,SayDigits(911)
 same => n,Wait(1)
 same => n,SayDigits(${ALERT_ROOM})
 same => n,Hangup()

; ---------------- inbound ----------------
[from-trunk]
; Pilot 1: outside callers reach the front desk.
exten => _X.,1,Dial(PJSIP/${FRONT_DESK_EXT},45)
 same => n,Hangup()
exten => s,1,Goto(from-trunk,0000,1)

[from-openai]
exten => _X.,1,Hangup()
exten => s,1,Hangup()
