name: Backend smoke

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-smoke.yml"
      - "scripts/caos-agent-team"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-smoke.yml"
      - "scripts/caos-agent-team"

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: caoscare_ci
      JWT_SECRET: ci-only-not-for-production
      CAOSCARE_ENABLE_DEMO_SEED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate persistent agent-team launcher
        run: |
          bash -n scripts/caos-agent-team
          ./scripts/caos-agent-team --help

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Catch fatal Python defects
        run: flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Import FastAPI application
        working-directory: backend
        run: python -c "import server; print('backend server import ok')"
