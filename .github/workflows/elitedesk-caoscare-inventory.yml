name: EliteDesk CAOSCare read-only inventory

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/2026-09-27
    paths:
      - .github/workflows/elitedesk-caoscare-inventory.yml
  push:
    branches:
      - chore/elitedesk-caoscare-bridge
    paths:
      - .github/workflows/elitedesk-caoscare-inventory.yml

permissions:
  contents: read

concurrency:
  group: elitedesk-caoscare-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Prove runner and inventory CAOSCare runtime
    runs-on: [self-hosted, Linux, X64, elitedesk, caoscare]
    timeout-minutes: 5

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4

      - name: Collect read-only EliteDesk evidence
        shell: bash
        run: |
          set -uo pipefail
          REPORT="${RUNNER_TEMP}/elitedesk-caoscare-inventory.txt"

          {
            echo "CAOSCARE ELITEDESK READ-ONLY INVENTORY"
            echo "report_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "host=$(hostname)"
            echo "user=$(id -un)"
            echo "uid_gid=$(id)"
            echo "runner_name=${RUNNER_NAME}"
            echo "runner_os=${RUNNER_OS}"
            echo "event_sha=${GITHUB_SHA}"
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "workspace=${GITHUB_WORKSPACE}"
            echo

            echo "== Candidate CAOSCare directories =="
            find /home/caoscare-1 -maxdepth 1 -mindepth 1 -type d -iname '*caos*' -print 2>/dev/null | sort
            echo

            echo "== Known checkout state =="
            for repo in               /home/caoscare-1/CAOSCARE.COM               /home/caoscare-1/CAOSCARE-INTEGRATION               /home/caoscare-1/CAOSCARE-ADMIN               /home/caoscare-1/CAOSCARE-LEVEL1-INTEGRATION
            do
              if git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
                echo "path=$repo"
                echo "head=$(git -C "$repo" rev-parse HEAD)"
                echo "branch=$(git -C "$repo" branch --show-current)"
                echo "tracked_changes=$(git -C "$repo" status --porcelain --untracked-files=no | wc -l)"
              else
                echo "path=$repo state=absent-or-not-git"
              fi
            done
            echo

            echo "== System services =="
            systemctl list-units --type=service --all --no-legend 2>/dev/null |
              grep -Ei 'caoscare|aria-wake|home.?assistant|mongod|nginx' || true
            echo

            echo "== User services =="
            systemctl --user list-units --type=service --all --no-legend 2>/dev/null |
              grep -Ei 'caoscare|aria-wake|home.?assistant' || true
            echo

            echo "== Relevant listening TCP ports =="
            ss -ltn 2>/dev/null |
              awk 'NR == 1 || $4 ~ /:(3000|3002|8000|8001|8092|8123|8765)$/'
            echo

            echo "== Listener process provenance =="
            for port in 3000 3002 8000 8001 8092 8123 8765
            do
              pids=$(fuser -n tcp "$port" 2>/dev/null | tr ' ' '\n' | grep -E '^[0-9]+$' | sort -u || true)
              if [ -z "$pids" ]; then
                echo "port=$port pid=NONE"
                continue
              fi
              for pid in $pids
              do
                echo "port=$port pid=$pid user=$(ps -o user= -p "$pid" | xargs) comm=$(ps -o comm= -p "$pid" | xargs)"
                echo "  cwd=$(readlink -f "/proc/$pid/cwd" 2>/dev/null || echo UNKNOWN)"
                echo "  exe=$(readlink -f "/proc/$pid/exe" 2>/dev/null || echo UNKNOWN)"
                if [ "$port" = "8092" ]; then
                  runtime_sha=$(tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null | sed -n 's/^CAOSCARE_RUNTIME_SHA=//p')
                  echo "  runtime_sha=${runtime_sha:-UNKNOWN}"
                fi
              done
            done
            echo

            echo "== User service definitions and state =="
            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            find "$HOME/.config/systemd/user" -maxdepth 1 -type f -name '*.service' -printf '%f\n' 2>/dev/null | sort
            for service in aria-wake.service aria-wake-page.service aria-wake-kiosk.service caoscare-frontend-dev.service
            do
              echo "service=$service"
              systemctl --user show "$service" --no-pager \
                -p LoadState -p ActiveState -p SubState -p FragmentPath -p ExecStart 2>/dev/null || true
            done
            echo

            echo "== Local HTTP probes =="
            for url in               http://127.0.0.1:8000/api/health               http://127.0.0.1:8001/api/health               http://127.0.0.1:8092/api/health               http://127.0.0.1:3002/api/health
            do
              code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 3 "$url" 2>/dev/null || true)
              [ -n "$code" ] || code=unreachable
              echo "$url status=$code"
            done
            echo

            echo "== Capacity =="
            df -h / /home/caoscare-1 2>/dev/null || true
            free -h 2>/dev/null || true
          } | tee "$REPORT"

      - name: Owner Aria creator-memory side task (one-shot)
        shell: bash
        run: |
          set -euo pipefail
          BACKEND=/home/caoscare-1/CAOSCARE-INTEGRATION/backend
          PY=/home/caoscare-1/CAOSCARE.COM/backend/.venv/bin/python3
          [ -x "$PY" ]
          [ -f "$BACKEND/.env" ]
          cd "$BACKEND"

          "$PY" - <<'PY'
          import asyncio
          import os
          from datetime import datetime, timezone
          from deps import db
          from models import AriaMemory
          from routes.aria_memory import build_aria_context_block

          async def main():
              owners = await db.users.find(
                  {"role": "owner"},
                  {"_id": 0, "user_id": 1, "name": 1},
              ).to_list(10)
              if len(owners) != 1:
                  print(f"owner_memory_status=BLOCKED owner_count={len(owners)}")
                  raise SystemExit(2)

              owner = owners[0]
              owner_id = owner["user_id"]
              owner_name = (owner.get("name") or "The CAOSCARE owner").strip()

              identity_text = (
                  f"{owner_name} is the human creator and owner of CAOSCARE. "
                  f"Aria and the other AI assistants have helped {owner_name} build CAOSCARE."
              )
              provenance_text = (
                  f"{owner_name} explicitly confirmed that he is the human creator and owner of CAOSCARE "
                  f"and that Aria and the other AI assistants helped him build it. "
                  "Before this confirmation, Aria had not verified that claim; "
                  "her earlier uncertainty remains historically correct."
              )

              identity = await db.aria_memories.find_one({
                  "owner_user_id": owner_id,
                  "category": "identity",
                  "bin": "standing",
                  "archived": {"$ne": True},
                  "text": {"$regex": "human creator.*CAOSCARE", "$options": "i"},
              }, {"_id": 0})

              if identity is None:
                  model = AriaMemory(
                      owner_user_id=owner_id,
                      text=identity_text,
                      category="identity",
                      bin="standing",
                      importance=5,
                      source="chat",
                      confidence="stated",
                      pinned=True,
                  )
                  doc = model.model_dump()
                  doc["created_at"] = doc["created_at"].isoformat()
                  await db.aria_memories.insert_one(doc)
                  identity_id = doc["memory_id"]
                  identity_result = "inserted"
              else:
                  identity_id = identity["memory_id"]
                  identity_result = "existing"

              provenance = await db.aria_memories.find_one({
                  "owner_user_id": owner_id,
                  "bin": "episodic",
                  "archived": {"$ne": True},
                  "text": {"$regex": "earlier uncertainty remains historically correct", "$options": "i"},
              }, {"_id": 0})

              if provenance is None:
                  model = AriaMemory(
                      owner_user_id=owner_id,
                      text=provenance_text,
                      category="session_summary",
                      bin="episodic",
                      importance=5,
                      source="chat",
                      confidence="stated",
                      pinned=False,
                  )
                  doc = model.model_dump()
                  doc["created_at"] = doc["created_at"].isoformat()
                  await db.aria_memories.insert_one(doc)
                  provenance_id = doc["memory_id"]
                  provenance_result = "inserted"
              else:
                  provenance_id = provenance["memory_id"]
                  provenance_result = "existing"

              stored_identity = await db.aria_memories.find_one(
                  {"memory_id": identity_id, "owner_user_id": owner_id},
                  {"_id": 0, "memory_id": 1, "text": 1, "category": 1, "bin": 1,
                   "importance": 1, "source": 1, "confidence": 1, "pinned": 1},
              )
              stored_provenance = await db.aria_memories.find_one(
                  {"memory_id": provenance_id, "owner_user_id": owner_id},
                  {"_id": 0, "memory_id": 1, "text": 1, "category": 1, "bin": 1,
                   "importance": 1, "source": 1, "confidence": 1, "pinned": 1},
              )

              assert stored_identity and stored_identity["text"] == identity_text
              assert stored_identity["category"] == "identity"
              assert stored_identity["bin"] == "standing"
              assert stored_identity["pinned"] is True
              assert stored_identity["confidence"] == "stated"

              assert stored_provenance and stored_provenance["text"] == provenance_text
              assert stored_provenance["bin"] == "episodic"
              assert stored_provenance["confidence"] == "stated"

              context = await build_aria_context_block(owner_id)
              assert identity_text in context
              assert provenance_text in context

              receipt_path = "/home/caoscare-1/.local/state/caoscare/owner-aria-memory-receipts.log"
              os.makedirs(os.path.dirname(receipt_path), exist_ok=True)
              stamp = datetime.now(timezone.utc).isoformat()
              with open(receipt_path, "a", encoding="utf-8") as fh:
                  fh.write(
                      f"{stamp} task=owner-aria-creator-memory "
                      f"identity={identity_result}:{identity_id} "
                      f"provenance={provenance_result}:{provenance_id} "
                      "context_verified=true\n"
                  )

              print("owner_memory_status=PASS")
              print(f"identity_result={identity_result}")
              print(f"identity_memory_id={identity_id}")
              print(f"provenance_result={provenance_result}")
              print(f"provenance_memory_id={provenance_id}")
              print("context_contains_identity=true")
              print("context_contains_provenance=true")
              print("personality_prompt_transcripts_changed=false")

          asyncio.run(main())
          PY

      - name: Preserve inventory receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elitedesk-caoscare-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/elitedesk-caoscare-inventory.txt
          if-no-files-found: error
          retention-days: 14
