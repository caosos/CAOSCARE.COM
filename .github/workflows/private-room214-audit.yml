name: Private Room 214 conversation audit

on:
  push:
    branches:
      - audit/room214-conversations-20261012
    paths:
      - .github/workflows/private-room214-audit.yml
      - scripts/private_audits/export_room214_recent.py
      - scripts/private_audits/room214_audit_public.pem

permissions:
  contents: read

jobs:
  encrypted-export:
    runs-on: [self-hosted, elitedesk, caoscare]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Export and encrypt without logging resident content
        shell: bash
        env:
          HOST_REPO: /home/caoscare-1/CAOSCARE-INTEGRATION
        run: |
          set -euo pipefail
          umask 077
          plain="$RUNNER_TEMP/room214-recent.json"
          encrypted="$RUNNER_TEMP/room214-recent.json.cms"
          cleanup() {
            if command -v shred >/dev/null 2>&1; then
              shred -u "$plain" 2>/dev/null || true
            else
              python3 -c 'import os,sys; p=sys.argv[1]; os.remove(p) if os.path.exists(p) else None' "$plain"
            fi
          }
          trap cleanup EXIT

          backend_pid="$(ss -ltnp 'sport = :8092' | sed -n 's/.*pid=\([0-9][0-9]*\).*/\1/p' | head -1)"
          test -n "$backend_pid"
          python_bin="$(readlink -f "/proc/$backend_pid/exe")"
          test -x "$python_bin"
          test -f "$HOST_REPO/backend/.env"

          "$python_bin" "$GITHUB_WORKSPACE/scripts/private_audits/export_room214_recent.py" \
            --env "$HOST_REPO/backend/.env" \
            --hours 48 --out "$plain"
          openssl cms -encrypt -binary -aes-256-cbc \
            -in "$plain" \
            -out "$encrypted" \
            -outform DER \
            "$GITHUB_WORKSPACE/scripts/private_audits/room214_audit_public.pem"
          test -s "$encrypted"
          sha256sum "$encrypted"
          printf 'ENCRYPTED_BYTES=%s\n' "$(wc -c < "$encrypted")"

      - name: Upload encrypted artifact only
        uses: actions/upload-artifact@v4
        with:
          name: room214-private-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/room214-recent.json.cms
          if-no-files-found: error
          retention-days: 1
