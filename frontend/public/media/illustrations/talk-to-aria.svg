<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
<title id="t">Illustration: a resident in an armchair says &quot;Hey Aria&quot; and asks for help; Aria answers by voice and the room display shows the request status</title>
<rect width="1600" height="900" fill="#F9FAFB"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="0" y="720" width="1600" height="180" fill="#F3F4F6" stroke="none"/><rect x="980" y="120" width="480" height="290" rx="20" fill="#111827"/><rect x="1004" y="144" width="432" height="242" rx="10" fill="#FFFFFF"/><text x="1220" y="220" font-size="44" font-weight="700" fill="#111827" stroke="none" text-anchor="middle">Hello, Sam.</text><text x="1220" y="270" font-size="26" font-weight="600" fill="#16A34A" stroke="none" text-anchor="middle">Nursing request · sent</text><text x="1220" y="314" font-size="24" font-weight="400" fill="#6B7280" stroke="none" text-anchor="middle">Lunch 12:00 · Concert 2 PM</text><text x="1220" y="450" font-size="24" font-weight="400" fill="#6B7280" stroke="none" text-anchor="middle">Room display: supporting information</text><rect x="1080" y="560" width="70" height="110" rx="20" fill="#FFFFFF" stroke="#111827" stroke-width="5"/><circle cx="1115" cy="640" r="16" fill="#2F80ED" stroke="none"/><text x="1115" y="705" font-size="22" font-weight="400" fill="#6B7280" stroke="none" text-anchor="middle">Speaker + mic</text><rect x="110" y="400" width="260" height="300" rx="50" fill="#DBEAFE" stroke="#111827" stroke-width="6"/><rect x="80" y="550" width="320" height="170" rx="40" fill="#BFDBFE" stroke="#111827" stroke-width="6"/><rect x="110" y="700" width="20" height="60" fill="#111827" stroke="none"/><rect x="350" y="700" width="20" height="60" fill="#111827" stroke="none"/><circle cx="260" cy="440" r="52" fill="#FDE7D3" stroke="#111827" stroke-width="6"/><path d="M180 650 C180 520 340 520 340 650" fill="#93C5FD" stroke="#111827" stroke-width="6"/><rect x="80" y="90" width="700" height="132" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><path d="M122 220 L110 256 L158 220" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="120" y="214" width="40" height="8" fill="#FFFFFF" stroke="none"/><text x="112" y="152" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">Hey Aria, could someone help</text><text x="112" y="198" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">me to the bathroom?</text><rect x="470" y="440" width="470" height="178" rx="28" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="3"/><path d="M862 616 L910 652 L898 616" fill="#EFF6FF" stroke="#E5E7EB" stroke-width="3"/><rect x="860" y="610" width="40" height="8" fill="#EFF6FF" stroke="none"/><text x="502" y="502" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">I&#x27;ve sent that to nursing.</text><text x="502" y="548" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">I&#x27;ll tell you when</text><text x="502" y="594" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">someone takes it.</text></g>
</svg>
