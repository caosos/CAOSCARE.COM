<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
<title id="t">Concept illustration: a salon chair and a haircut request that is booked only after the salon confirms</title>
<rect width="1600" height="900" fill="#F9FAFB"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="230" y="600" width="380" height="60" rx="20" fill="#111827"/><rect x="400" y="660" width="40" height="110" fill="#111827" stroke="none"/><rect x="300" y="770" width="240" height="24" rx="12" fill="#111827" stroke="none"/><rect x="250" y="300" width="340" height="320" rx="60" fill="#FCE7F3" stroke="#111827" stroke-width="7"/><rect x="200" y="470" width="440" height="80" rx="30" fill="#FBCFE8" stroke="#111827" stroke-width="7"/><rect x="280" y="110" width="280" height="160" rx="80" fill="#FFFFFF" stroke="#111827" stroke-width="6"/><text x="420" y="205" font-size="36" font-weight="700" fill="#111827" stroke="none" text-anchor="middle">Salon</text><rect x="860" y="200" width="600" height="200" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="860" y="200" width="10" height="200" rx="5" fill="#D97706" stroke="none"/><text x="900" y="258" font-size="32" font-weight="700" fill="#111827" stroke="none" text-anchor="start">Request: haircut Thursday</text><text x="900" y="308" font-size="28" font-weight="600" fill="#B45309" stroke="none" text-anchor="start">Waiting for the salon</text><rect x="860" y="470" width="600" height="200" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="860" y="470" width="10" height="200" rx="5" fill="#16A34A" stroke="none"/><text x="900" y="528" font-size="32" font-weight="700" fill="#111827" stroke="none" text-anchor="start">Booked only when</text><text x="900" y="578" font-size="28" font-weight="600" fill="#16A34A" stroke="none" text-anchor="start">the salon confirms</text></g>
</svg>
