<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
<title id="t">Illustration: Aria sends an infrared command to the room&#x27;s TV and mutes it while she talks; infrared cannot read back the TV&#x27;s state</title>
<rect width="1600" height="900" fill="#F9FAFB"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="760" y="140" width="720" height="430" rx="22" fill="#111827"/><rect x="784" y="164" width="672" height="382" rx="10" fill="#1E3A8A"/><text x="1120" y="370" font-size="32" font-weight="600" fill="#FFFFFF" stroke="none" text-anchor="middle">Sound muted while Aria talks</text><rect x="1080" y="570" width="80" height="60" fill="#111827" stroke="none"/><rect x="980" y="630" width="280" height="22" rx="10" fill="#111827" stroke="none"/><rect x="420" y="560" width="150" height="90" rx="20" fill="#FFFFFF" stroke="#111827" stroke-width="6"/><circle cx="545" cy="605" r="14" fill="#DC2626" stroke="none"/><text x="495" y="700" font-size="26" font-weight="400" fill="#6B7280" stroke="none" text-anchor="middle">Infrared adapter</text><path d="M590 585 Q680 470 760 420" stroke="#2F80ED" stroke-opacity="0.8" stroke-width="6" stroke-dasharray="16 12"/><path d="M590 555 Q680 430 760 390" stroke="#2F80ED" stroke-opacity="0.6499999999999999" stroke-width="6" stroke-dasharray="16 12"/><path d="M590 525 Q680 390 760 360" stroke="#2F80ED" stroke-opacity="0.5" stroke-width="6" stroke-dasharray="16 12"/><rect x="80" y="140" width="560" height="132" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><path d="M122 270 L110 306 L158 270" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="120" y="264" width="40" height="8" fill="#FFFFFF" stroke="none"/><text x="112" y="202" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">Aria, turn my</text><text x="112" y="248" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">TV down.</text><text x="495" y="780" font-size="26" font-weight="600" fill="#111827" stroke="none" text-anchor="middle">One-way: the command is sent, not read back</text></g>
</svg>
