<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
<title id="t">Concept illustration: a resident asks Aria to tell her daughter she is going to a concert; an update reaches only authorized family, with only what the resident chooses to share</title>
<rect width="1600" height="900" fill="#F9FAFB"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="120" y="430" width="260" height="300" rx="50" fill="#DBEAFE" stroke="#111827" stroke-width="6"/><rect x="90" y="580" width="320" height="170" rx="40" fill="#BFDBFE" stroke="#111827" stroke-width="6"/><rect x="120" y="730" width="20" height="60" fill="#111827" stroke="none"/><rect x="360" y="730" width="20" height="60" fill="#111827" stroke="none"/><circle cx="270" cy="470" r="52" fill="#FDE7D3" stroke="#111827" stroke-width="6"/><path d="M190 680 C190 550 350 550 350 680" fill="#93C5FD" stroke="#111827" stroke-width="6"/><rect x="80" y="120" width="640" height="132" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><path d="M122 250 L110 286 L158 250" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="120" y="244" width="40" height="8" fill="#FFFFFF" stroke="none"/><text x="112" y="182" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">Aria, let my daughter know</text><text x="112" y="228" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">I&#x27;m going to the concert.</text><rect x="980" y="90" width="400" height="720" rx="56" fill="#111827"/><rect x="1004" y="150" width="352" height="600" rx="18" fill="#FFFFFF"/><text x="1180" y="215" font-size="28" font-weight="700" fill="#111827" stroke="none" text-anchor="middle">Anna · Daughter</text><text x="1180" y="252" font-size="22" font-weight="600" fill="#16A34A" stroke="none" text-anchor="middle">authorized family</text><rect x="1030" y="290" width="300" height="190" rx="22" fill="#EFF6FF" stroke="none"/><text x="1050" y="340" font-size="26" font-weight="700" fill="#111827" stroke="none" text-anchor="start">Update from Mom</text><text x="1050" y="382" font-size="26" font-weight="400" fill="#111827" stroke="none" text-anchor="start">Going to the 2 PM</text><text x="1050" y="420" font-size="26" font-weight="400" fill="#111827" stroke="none" text-anchor="start">concert today.</text><text x="1050" y="458" font-size="20" font-weight="400" fill="#6B7280" stroke="none" text-anchor="start">Sent via CAOSCare</text><text x="1180" y="560" font-size="24" font-weight="400" fill="#6B7280" stroke="none" text-anchor="middle">Only what she</text><text x="1180" y="594" font-size="24" font-weight="400" fill="#6B7280" stroke="none" text-anchor="middle">chooses to share.</text><path d="M760 330 C840 330 880 380 960 380" stroke="#2F80ED" stroke-width="6" stroke-dasharray="14 12"/><path d="M944 362 L966 381 L944 400" stroke="#2F80ED" stroke-width="6"/></g>
</svg>
