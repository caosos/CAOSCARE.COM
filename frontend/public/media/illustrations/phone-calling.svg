<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t">
<title id="t">Concept illustration: a simple handset and a resident asking Aria to call the front desk; the call status is reported only as it really happened</title>
<rect width="1600" height="900" fill="#F9FAFB"/>
<g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M300 520 L700 520 L760 760 L240 760 Z" fill="#FFFFFF" stroke="#111827" stroke-width="8"/><path d="M260 470 C260 360 740 360 740 470 L700 520 L620 520 L600 470 L400 470 L380 520 L300 520 Z" fill="#DBEAFE" stroke="#111827" stroke-width="8"/><rect x="420" y="580" width="160" height="110" rx="14" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="4"/><rect x="160" y="110" width="620" height="132" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><path d="M202 240 L190 276 L238 240" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="200" y="234" width="40" height="8" fill="#FFFFFF" stroke="none"/><text x="192" y="172" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">Aria, call the</text><text x="192" y="218" font-size="32" font-weight="500" fill="#111827" stroke="none" text-anchor="start">front desk.</text><rect x="920" y="230" width="560" height="330" rx="22" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="3"/><rect x="920" y="230" width="10" height="330" rx="5" fill="#2F80ED" stroke="none"/><text x="960" y="288" font-size="34" font-weight="700" fill="#111827" stroke="none" text-anchor="start">Call · Front desk</text><text x="960" y="338" font-size="28" font-weight="600" fill="#16A34A" stroke="none" text-anchor="start">Approved contact ✓</text><text x="960" y="388" font-size="28" font-weight="400" fill="#6B7280" stroke="none" text-anchor="start">Status told truthfully:</text><text x="960" y="438" font-size="28" font-weight="400" fill="#6B7280" stroke="none" text-anchor="start">ringing · connected · no answer</text><text x="960" y="488" font-size="28" font-weight="400" fill="#6B7280" stroke="none" text-anchor="start">never &quot;connected&quot; by guess</text></g>
</svg>
